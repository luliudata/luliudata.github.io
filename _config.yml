title: "Lu Liu"
author: "Lu Liu"
description: "Lu Liu — Data & MLOps Engineer. Notes on MLOps, AWS, AI agents and side projects."
url: "https://luliudata.github.io"
permalink: /:title/
lang: "en"
excerpt_separator: "\n\n\n"
date_format: "%B %d, %Y"

defaults:
  - scope: {path: "", type: posts}
    values: {layout: post}
  # Note: no default layout for 'pages' — that would also match generated
  # files like assets/fontawesome/icons.svg (which has empty front-matter
  # to trigger Liquid) and wrap them in a page layout, breaking the SVG
  # sprite. Every content page declares its own layout explicitly.

# Layout

show_excerpts: false        # show article excerpts on the home page
show_frame: true           # adds a gray frame to the site
show_sidebar: false        # show a sidebar instead of the usual header
minimal: true             # use a dark header

# Menu

navigation:                # header — accepts {file, title, url, icon}
  - {url: "/blog/",     title: "Blog"}
  - {url: "/projects/", title: "Projects"}

external:                  # footer social links — icons: fontawesome.com/icons
  - {title: LinkedIn, icon: linkedin, url: "https://www.linkedin.com/in/lu-liu/"}
  - {title: X,        icon: twitter,  url: "https://twitter.com/luuuuliu"}
  - {title: Github,   icon: github,   url: "https://github.com/luliudata/"}
  - {title: Mail,     icon: envelope, url: "mailto:luliudata@gmail.com"}
#  - {title: Subscribe, icon: rss, url: "/feed.xml"}

comments:
#  disqus_shortname: ""    # see https://disqus.com/
#  isso_domain: ""         # see https://posativ.org/isso/

plugins:
 - jekyll-feed

exclude:
  - vendor
  - preview
  - README.md
  - UNLICENSE.txt
  - Gemfile
  - Gemfile.lock
